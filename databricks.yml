bundle:
  name: regression-validation
  databricks_cli_version: ">=0.283.0"

# ---------------------------------------------------------------------------
# Resources: Lakebase (operational store), the App, and the scheduled job.
# ---------------------------------------------------------------------------
resources:
  database_instances:
    rv_db:
      name: "regression-validation-${var.environment}"
      enable_pg_native_login: true
      capacity: "CU_1"
      lifecycle:
        # Operational state (run history, audit) must survive redeploys.
        prevent_destroy: true
      permissions:
        # Re-grant the deploying user CAN_MANAGE (authoritative ACL), else the
        # app's postgres resource attach later fails with "User needs MANAGE".
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          service_principal_name: ${resources.apps.regression-validation.service_principal_client_id}
        - level: CAN_USE
          group_name: "users"

  apps:
    regression-validation:
      name: ${var.app_name}
      description: "Databricks-native regression & connectivity validation platform (${var.environment})"
      source_code_path: "${var.source_code_path}"
      resources:
        # Lakebase autoscaling project/branch attach (CAN_CONNECT_AND_CREATE).
        # Injects PGHOST/PGPORT/PGDATABASE/PGUSER into the app runtime.
        - name: postgres
          postgres:
            branch: projects/${resources.database_instances.rv_db.name}/branches/production
            database: projects/${resources.database_instances.rv_db.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        # SQL warehouse used by SQL-warehouse probes and analytical chart queries.
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        # Foundation Model endpoint for the Model Serving probe + AI test authoring.
        # Grants the app service principal CAN_QUERY (adds the serving OAuth scope).
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model_serving_endpoint}
            permission: CAN_QUERY
      config:
        command:
          - python
          - backend/run.py
        env:
          - name: ENVIRONMENT
            value: "${var.environment}"
          - name: LOG_LEVEL
            value: "INFO"
          - name: API_V1_PREFIX
            value: "/api/v1"
          - name: SEED_ON_STARTUP
            value: "${var.seed_on_startup}"
          - name: POLLER_ENABLED
            value: "true"
          - name: POLLER_INTERVAL_SECONDS
            value: "5"
          - name: POLLER_BATCH_SIZE
            value: "25"
          - name: POLLER_MAX_CONCURRENT
            value: "10"
          - name: OTEL_ENABLED
            value: "${var.otel_enabled}"
          # SQL warehouse id (also injected by the resource; set explicitly so
          # the probe defaults resolve without depending on resource var names).
          - name: DATABRICKS_WAREHOUSE_ID
            value: "${var.sql_warehouse_id}"
          - name: MODEL_SERVING_ENDPOINT
            value: "${var.model_serving_endpoint}"
          # The scheduled suite-runner job id (created below); lets the app
          # offload heavy/scheduled fan-out instead of running it inline.
          - name: SUITE_RUNNER_JOB_ID
            value: "${resources.jobs.suite_runner.id}"
          # NOTE: remote-agent result signing is optional. To enable it, create a
          # secret scope/key, declare a `secret` app resource above, and add an
          # env entry with `value_from: <resource-name>`. Left out by default so
          # the bundle deploys without a pre-existing secret.
      user_api_scopes:
        - "sql"
        - "sql.statement-execution"
        - "sql.warehouses"
        - "catalog.connections"
        - "dashboards.genie"
        # Required to query Model Serving / Foundation Model / AI Gateway
        # endpoints (the Model Serving probe + AI test authoring). Without it the
        # forwarded OAuth token is downscoped and serving queries fail with
        # "OAuth token does not have required scopes".
        - "serving.serving-endpoints"
        - "ai-gateway"
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"
        - level: CAN_USE
          group_name: "users"
        - level: CAN_USE
          group_name: "account users"

  # Nightly regression trigger. It is NOT a scheduled-only engine — it is just
  # another authenticated caller of the shared Run API the CI Action and GUI use
  # (ADR-0005), starting a run and polling it fail-closed. Nightly opts into
  # depth=full (CI defaults to quick); one engine behind all three triggers.
  jobs:
    suite_runner:
      name: "${var.app_name}-suite-runner-${var.environment}"
      schedule:
        quartz_cron_expression: "${var.nightly_cron}"
        timezone_id: "UTC"
        pause_status: "${var.schedule_pause_status}"
      tasks:
        - task_key: run_full_regression
          environment_key: default
          spark_python_task:
            python_file: "databricks/jobs/run_suite.py"
            parameters: ["--app-url", "${var.validation_app_url}", "--depth", "full"]
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - sqlmodel>=0.0.22
              - psycopg2-binary>=2.9.9
              - databricks-sdk>=0.30.0
              - croniter>=2.0.0
              - httpx>=0.27.0
      permissions:
        - level: CAN_MANAGE
          user_name: "${workspace.current_user.userName}"

# ---------------------------------------------------------------------------
# Sync: ship the frontend SOURCE + backend + job code. The Databricks Apps Node
# buildpack detects package.json and runs `npm install && npm run build` at
# deploy time; Vite (vite.config.ts build.outDir) emits to backend/static, which
# the FastAPI `command` then serves. We never build the client locally. The
# lockfile is intentionally NOT shipped (see exclude note below).
#
# `include` force-syncs the frontend config files that are otherwise gitignored.
# We only exclude heavy / generated dirs - critically the local `.databricks`
# CLI working dir, which holds the ~64MB terraform-provider-databricks binary
# that exceeds the 10MB workspace per-file import limit during app deploy.
# ---------------------------------------------------------------------------
sync:
  include:
    - package.json
    - vite.config.ts
    - tsconfig.json
    - tailwind.config.js
    - postcss.config.js
    - eslint.config.js
    - index.html
    - src/**
    - public/**
    - backend/**
    - databricks/**
    - app.yaml
  exclude:
    # Local CLI/terraform working dir - contains the ~64MB databricks provider
    # binary that exceeds the 10MB workspace per-file import limit on app deploy.
    - .databricks/**
    - "**/.databricks/**"
    - .git/**
    # Frontend deps + build output (Databricks reinstalls/rebuilds these)
    - node_modules/**
    - "**/node_modules/**"
    - dist/**
    - .vite/**
    # NEVER ship package-lock.json: its `resolved` URLs are pinned to the
    # internal npm-proxy.dev.databricks.com registry, which the Databricks Apps
    # build sandbox can't reach. Shipping it makes the buildpack run `npm ci`
    # against the proxy and crash ("Exit handler never called"). Omitting it lets
    # Databricks run plain `npm install` against the default public registry.
    - package-lock.json
    # Repo docs / infra / tests not needed in the running app
    - tests/**
    - docs/**
    - infra/**
    - shared/**
    # Python + env cruft
    - backend/venv/**
    - backend/.venv/**
    - backend/__pycache__/**
    - backend/**/__pycache__/**
    - backend/**/*.pyc
    - backend/*.db
    - backend/.env
    - backend/.env.*
    - "**/.DS_Store"
    - "**/*.log"

variables:
  app_name:
    description: "Databricks App name"
    default: "regression-validation"
  environment:
    description: "Environment (local|dev|stage|prod)"
    default: "dev"
  source_code_path:
    description: "Path to synced source in the workspace"
    default: "."
  sql_warehouse_id:
    description: "SQL Warehouse id for probes + chart queries"
    lookup:
      warehouse: "Serverless Starter Warehouse"
  model_serving_endpoint:
    description: "Model Serving endpoint for serving probes"
    default: "databricks-claude-sonnet-4-6"
  seed_on_startup:
    description: "Seed the real test catalog (definitions/suites/schedules) on first boot. Idempotent; demo targets stay off."
    default: "true"
  otel_enabled:
    description: "Enable OpenTelemetry -> Unity Catalog app telemetry"
    default: "true"
  nightly_cron:
    description: "Quartz cron for the nightly full regression run"
    default: "0 0 7 * * ?"
  schedule_pause_status:
    description: "PAUSED or UNPAUSED for the suite-runner schedule"
    default: "UNPAUSED"
  validation_app_url:
    description: "Base URL of the deployed validation app; the nightly job calls its shared Run API (ADR-0005)."
    default: ""

targets:

  dev:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      host: "https://fevm-taylor-hanson-build.cloud.databricks.com"
    variables:
      app_name: "regression-validation-dev"
      environment: "dev"